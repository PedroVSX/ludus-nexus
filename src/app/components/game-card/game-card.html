<div class="game-card">
    <div class="card-art-wrap">
        <div class="game-art">
            <img src="{{ imageUrl }}" alt="Imagem do Jogo">
        </div>
        <span class="match-badge">
            <mat-icon>auto_awesome</mat-icon>
            {{ score | percent:'1.1-1' }} match
        </span>
    </div>

    <div class="card-content">
        <div class="game-meta">

        </div>

        <h2>{{ name }}</h2>
        <p>{{ shortDescription }}</p>

        <div class="tag-row">

        </div>

        <div class="spec-row">

        </div>
    </div>
</div>
