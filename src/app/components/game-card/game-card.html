<div class="container" (click)="openSteamPage(appId)">
    <div class="game-image">
        <img src="{{ imageUrl }}" alt="Imagem do Jogo">
    </div>

    <div class="game-info">
        <h3 class="title">{{ name }}</h3>
        <p class="description">{{ shortDescription }}</p>
        <p class="score">Score: {{ score | percent:'1.1-1' }}</p>
    </div>
</div>
