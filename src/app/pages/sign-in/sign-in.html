<div class="container">
    <div class="card-container">
        <div class="icon">
            <img src="favicon.ico" alt="Ludus Nexus Icon">
        </div>

        <div class="app-name">
            <h1>Ludus Nexus</h1>
        </div>

        <div class="sign-in-text">
            <p>Não possui uma conta? <a class="highlight">Cadastre-se aqui</a></p>
        </div>

        <hr class="line">

        <form class="form" [formGroup]="signInForm" (ngSubmit)="onSubmit()">

            <input class="form-field" formControlName="username" placeholder="Nome de usuário" />
            @if (signInForm.controls.username.invalid && signInForm.controls.username.touched) {
                <div class="alert">Nome é obrigatório</div>
            }

            <input class="form-field" formControlName="password" type="password" placeholder="Senha" />
            @if (signInForm.controls.password.invalid && signInForm.controls.password.touched) {
                <div class="alert">Senha é obrigatória</div>
            }

            <button class="btn primary btn-margin" type="submit" [disabled]="signInForm.invalid">Entrar</button>

            </form>
    </div>
</div>
