<div class="container">
    <div class="card-container">
        <img class="icon" src="favicon.svg" alt="Favicon">
        <h1>Ludus Nexus</h1>
        <p class="text">Insira seu nome de usuário para iniciar a recomendação</p>
        <hr>

        <input 
            class="input-username" 
            [(ngModel)]="username" 
            (input)="errorMessage = ''"
            name="username"
            placeholder="Nome de usuário">

        <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

        <button class="btn primary" (click)="search()">Iniciar</button>
    </div>
</div>
