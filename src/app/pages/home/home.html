<div class="main-wrapper">
    <div class="page-container">
        <div class="recommendation-header">
            <div>
                <div class="eyebrow">
                    <mat-icon>auto_awesome</mat-icon>
                    CURADORIA PERSONALIZADA
                </div>

                <h1>
                    Jogos escolhidos para <em>você.</em>
                </h1>

                <p>Baseado no seu perfil Steam e no que você costuma jogar.</p>
            </div>
        </div>

        <div class="toolbar">

        </div>

        <div class="recommendation-layout">
            <aside>
                <div class="side-title">Seu perfil</div>

                <app-profile-card
                    *ngIf="profile as p"
                    [name]="p.name"
                    [avatar]="p.avatar"
                    [totalGames]="p.totalGames"
                    [totalWishlist]="p.totalWishlist"
                    [totalFriends]="p.totalFriends"
                    [favoriteGenres]="p.favoriteGenres">
                </app-profile-card>
            </aside>

            <div class="games-grid">
                <app-game-card
                    *ngFor="let game of visibleGames"
                    [appId]="game.appId"
                    [name]="game.name"
                    [shortDescription]="game.shortDescription"
                    [imageUrl]="game.imageUrl"
                    [score]="game.score">
                </app-game-card>
            </div>
        </div>
    </div>

    <app-footer></app-footer>
</div>
